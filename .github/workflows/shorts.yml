name: shorts
on:
  schedule:
    - cron: "30 7 * * 1"     # Monday morning: Fri-Sun games
    - cron: "30 7 * * 4"     # Thursday morning: midweek games (skipped if fewer than 3)
  workflow_dispatch:
    inputs:
      test_upload:
        description: "Only re-upload the newest existing video to YouTube as PRIVATE (connection test)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
      - run: pip install pillow edge-tts numpy
      - name: Make the video
        if: ${{ github.event.inputs.test_upload != 'true' }}
        run: mkdir -p shorts/out && python shorts/make_short.py 2>&1 | tee shorts/out/log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: (test) fetch the newest existing video
        if: ${{ github.event.inputs.test_upload == 'true' }}
        run: |
          mkdir -p shorts/out && git fetch -q origin shorts
          f=$(git ls-tree --name-only origin/shorts | grep '^pl_.*mp4$' | sort | tail -1)
          git show origin/shorts:$f > shorts/out/$f && git show origin/shorts:${f%.mp4}.json > shorts/out/${f%.mp4}.json
          git show origin/shorts:log.txt > shorts/out/log.txt || true
      - name: Upload to YouTube
        run: python shorts/upload_youtube.py 2>&1 | tee -a shorts/out/log.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ github.event.inputs.test_upload == 'true' && 'private' || 'public' }}
      - name: Save videos to the shorts branch
        if: always()
        run: |
          mkdir /tmp/o && cd /tmp/o && git init -q -b shorts
          git config user.name shorts && git config user.email shorts@users.noreply.github.com
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shorts && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/shorts/out/*.mp4 $GITHUB_WORKSPACE/shorts/out/*.json $GITHUB_WORKSPACE/shorts/out/log.txt . 2>/dev/null || true
          ls *.mp4 > index.txt 2>/dev/null || true
          git add . && git commit -qm "short $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:shorts
