name: gaps
on:
  schedule:
    - cron: "17 16 * * *"     # once a day, 2 leagues x 2 markets = ~120 credits a month (key shared with the Pinnacle bot)
  workflow_dispatch:
permissions:
  contents: write
concurrency: gaps
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load saved state
        run: |
          # (12 Nov) stop (red X) if the saved branch can't be fetched, rather than starting from scratch and
          # overwriting the saved gap history with an empty one
          ok=""; for i in 1 2 3; do if git fetch -q origin gaps; then ok=1; break; fi; sleep 15; done
          [ -n "$ok" ] || { echo "::error::could not fetch saved state - stopping so nothing gets overwritten"; exit 1; }
          git checkout -q FETCH_HEAD -- gaps_state.json
          git checkout -q FETCH_HEAD -- gaps_log.csv 2>/dev/null || echo "no gaps logged yet"
      - run: python gaps/gap_bot.py 2>&1 | tee run.txt
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Save results
        if: always()
        run: |
          mkdir /tmp/out && cp gaps.md gaps_state.json gaps_log.csv run.txt /tmp/out/ 2>/dev/null || true; cd /tmp/out
          git init -q -b gaps
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm results
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gaps
