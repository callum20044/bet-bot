name: gaps
on:
  schedule:
    - cron: "17 10 * * *"     # 10:17 UTC; the Oracle server also starts it at 16:17 UK time. Bookie odds only now
                              # (Betfair prices come from Betfair itself): 2 runs x 2 leagues x 1 credit = ~120 credits a month
  workflow_dispatch:
permissions:
  contents: write
concurrency: gaps
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Load saved state
        run: |
          # (12 Nov) stop (red X) if the saved branch can't be fetched, rather than starting from scratch and
          # overwriting the saved gap history with an empty one
          ok=""; for i in 1 2 3; do if git fetch -q origin gaps; then ok=1; break; fi; sleep 15; done
          [ -n "$ok" ] || { echo "::error::could not fetch saved state - stopping so nothing gets overwritten"; exit 1; }
          git checkout -q FETCH_HEAD -- gaps_state.json
          git checkout -q FETCH_HEAD -- gaps_log.csv 2>/dev/null || echo "no gaps logged yet"
      - name: Open the UK tunnel to Betfair (Oracle server, London)
        continue-on-error: true      # if the server is down the bot still does the bookie-vs-bookie check
        run: bash .github/betfair-tunnel.sh
        env:
          BF_HOST: ${{ secrets.BETFAIR_SSH_HOST }}
          BF_KEY: ${{ secrets.BETFAIR_SSH_KEY }}
          BF_HOSTKEY: ${{ secrets.BETFAIR_SSH_HOSTKEY }}
      - run: python gaps/gap_bot.py 2>&1 | tee run.txt
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      - name: Save results
        if: always()
        run: |
          mkdir /tmp/out && cp gaps.md gaps_state.json gaps_log.csv run.txt /tmp/out/ 2>/dev/null || true; cd /tmp/out
          git init -q -b gaps
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm results
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gaps
