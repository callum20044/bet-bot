name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m predbot.probe
      - name: Save to probe branch
        run: |
          mkdir /tmp/out && cp probe.md /tmp/out/ && cd /tmp/out
          git init -q -b probe
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add . && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
