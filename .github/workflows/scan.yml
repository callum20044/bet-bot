name: scan

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load previous results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # (12 Nov) Only start fresh if the data branch truly doesn't exist. Before, ANY failed download (a
          # GitHub hiccup) counted as "no previous results", and the run then overwrote the whole betting
          # history with a brand-new empty database.
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$url" data >/dev/null 2>&1 || rc=$?
          if [ "$rc" = "2" ]; then
            echo "No previous results yet - starting fresh with \$1,000 paper money"
          else
            ok=""; for i in 1 2 3; do
              rm -rf prev
              if git clone --quiet --depth 1 --branch data "$url" prev 2>/dev/null && [ -s prev/predbot.db ]; then ok=1; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "::error::could not load previous results - stopping so the saved history is not overwritten"; exit 1; }
            cp prev/predbot.db predbot.db && echo "Loaded previous results"
          fi

      - name: Load recent price history
        uses: actions/cache/restore@v4
        with:
          path: snapshots.db
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-

      - name: Scan markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional - only the sharp-bookie strategy uses it
        run: python -m predbot.bot --loops 1 --db predbot.db --snapshots snapshots.db

      - name: Save results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp predbot.db out/
          cd out
          git init --quiet -b data
          git config user.name "predbot"
          git config user.email "predbot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Save recent price history
        if: always() && hashFiles('snapshots.db') != ''
        uses: actions/cache/save@v4
        with:
          path: snapshots.db
          key: snapshots-${{ github.run_id }}

      - name: Build dashboard
        run: python -m predbot.export_site --db predbot.db --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
